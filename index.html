<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fang Yetien!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- STARTSKÆRM -->
  <div id="startScreen">
    <h1>Fang Yetien!</h1>
    <button id="startBtn" onclick="startGame()">Start spil</button>
  </div>

  <!-- SELVE SPILLET (skjult indtil man trykker Start) -->
  <div id="gameArea" style="display:none;">

    <div class="panel">
      <label>Udforsk</label>
      <input id="interactA" placeholder="fx854">
      <input id="interactB" placeholder="fx259">
      <button onclick="interact()">OK</button>
    </div>

    <div class="panel">
      <label>Kode</label>
      <input id="codeInput" placeholder="5287">
      <button onclick="checkCode()">OK</button>
    </div>

    <button id="hintBtn" onclick="showHint()">?</button>

    <div id="dialogArea">
      <p id="dialogText"></p>
      <button id="nextBtn" onclick="nextDialog()">Næste</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
